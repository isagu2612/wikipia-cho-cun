<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giải bài tập SGK Toán 12 – Tập 2</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  :root{
    --page:#f7f7f7;
    --surface:#ffffff;
    --ink:#0b0b0c;
    --ink-2:#3f3f46;
    --muted:#71717a;
    --line:#e6e6e9;
    --line-strong:#d4d4d8;
    --soft:#f2f2f3;
    --radius:16px;
    --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--page); color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- Header ---------- */
  header{
    flex:0 0 auto; background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:14px 20px;
  }
  .header-inner{
    max-width:880px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand .mark{
    width:38px; height:38px; border-radius:11px; flex:0 0 auto;
    background:var(--ink); color:#fff; display:grid; place-items:center;
  }
  .brand .mark svg{width:21px; height:21px}
  .brand h1{font-size:16.5px; margin:0; font-weight:650; letter-spacing:-.01em}
  .brand p{margin:2px 0 0; font-size:12.5px; color:var(--muted)}

  /* ---------- Chuyển chế độ ---------- */
  .mode-switch{
    position:relative; display:inline-flex; flex:0 0 auto;
    background:var(--surface); border:1.5px solid var(--line-strong);
    border-radius:999px; overflow:hidden;
  }
  .mode-thumb{
    position:absolute; top:0; bottom:0; left:0; width:0; z-index:0;
    background:var(--ink); border-radius:999px;
    transition:transform .32s cubic-bezier(.4,0,.2,1), width .32s cubic-bezier(.4,0,.2,1);
  }
  .mode-btn{
    position:relative; z-index:1; flex:1 1 0; white-space:nowrap;
    border:0; background:transparent; color:var(--ink-2); font:inherit;
    font-size:12.5px; font-weight:600; padding:7px 14px; cursor:pointer;
    transition:color .22s ease, transform .1s ease;
  }
  .mode-btn:hover{ color:var(--ink) }
  .mode-btn:active{ transform:scale(.94) }
  .mode-btn.active{ color:#fff }
  .notice{
    align-self:center; max-width:880px; width:100%; text-align:center;
    font-size:12.5px; color:var(--muted);
    animation:fadeIn .3s ease both;
  }

  /* ---------- Chat ---------- */
  #chat{
    flex:1 1 auto; overflow-y:auto; padding:22px 16px 8px;
    display:flex; flex-direction:column; gap:16px;
    scroll-behavior:smooth;
  }
  /* Đẩy hội thoại xuống sát thanh nhập khi còn ít tin nhắn;
     khi nội dung dài thì cuộn bình thường (không bị cắt phần đầu). */
  #chat::before{content:""; margin-top:auto}
  .row{display:flex; gap:10px; max-width:880px; width:100%; margin:0 auto; align-items:flex-start;
    animation:riseIn .34s cubic-bezier(.2,.7,.3,1) both}
  .row.user{flex-direction:row-reverse}

  .avatar{
    flex:0 0 32px; height:32px; width:32px; border-radius:50%;
    display:grid; place-items:center; margin-top:2px;
    background:var(--ink); color:#fff; user-select:none;
  }
  .row.user .avatar{background:var(--surface); color:var(--ink); border:1.5px solid var(--line-strong)}
  .avatar svg{width:16px; height:16px}

  .bubble{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 18px; box-shadow:var(--shadow);
    min-width:0; max-width:calc(100% - 44px);
    overflow-wrap:anywhere;
    transition:box-shadow .22s ease, border-color .22s ease, transform .22s ease;
  }
  .row.bot .bubble:hover{border-color:var(--line-strong); box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .bubble.reveal{animation:revealIn .38s ease both}
  .row.user .bubble{
    background:var(--ink); color:#fff; border-color:var(--ink);
    white-space:pre-wrap; max-width:min(78%, 640px);
    box-shadow:none; font-size:14.5px;
  }
  .bubble.error{border-color:var(--ink); border-style:dashed; background:var(--soft)}
  .bubble .meta{font-size:12px; color:var(--muted); margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .badge{
    display:inline-block; background:var(--soft); color:var(--ink-2);
    border:1px solid var(--line-strong); border-radius:999px;
    padding:1px 9px; font-size:11.5px; font-weight:600;
  }

  /* ---------- Markdown ---------- */
  .bubble h1,.bubble h2,.bubble h3{font-size:15.5px; margin:16px 0 7px; line-height:1.4}
  .bubble h1:first-child,.bubble h2:first-child,.bubble h3:first-child{margin-top:0}
  .bubble p{margin:9px 0; line-height:1.68}
  .bubble ul,.bubble ol{margin:9px 0; padding-left:22px}
  .bubble li{margin:5px 0; line-height:1.6}
  .bubble hr{border:0; border-top:1px solid var(--line); margin:16px 0}
  .bubble img{
    display:block; max-width:100%; height:auto; margin:12px auto;
    border:1px solid var(--line); border-radius:10px; background:#fff;
  }
  .bubble blockquote{margin:10px 0; padding:2px 0 2px 14px; border-left:3px solid var(--line-strong); color:var(--ink-2)}
  .bubble table{border-collapse:collapse; margin:12px 0; font-size:13.5px; width:100%}
  .bubble th,.bubble td{border:1px solid var(--line); padding:7px 11px; text-align:left}
  .bubble th{background:var(--soft); font-weight:600}
  .bubble code{background:var(--soft); border:1px solid var(--line); padding:1px 5px; border-radius:5px; font-size:12.8px}
  .bubble pre{background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:12px; overflow:auto}
  .bubble pre code{background:none; border:0; padding:0}
  .katex-display{margin:12px 0 !important; overflow-x:auto; overflow-y:hidden; padding:2px 0}
  .katex{font-size:1.03em}

  /* ---------- Page reference ---------- */
  details.ref{margin-top:14px; border-top:1px dashed var(--line); padding-top:10px}
  details.ref summary{
    cursor:pointer; font-size:12.5px; color:var(--muted); padding:3px 0;
    list-style:none; display:flex; align-items:center; gap:7px;
    transition:color .18s;
  }
  details.ref summary::-webkit-details-marker{display:none}
  details.ref summary::before{
    content:"▸"; display:inline-block; font-size:11px;
    transition:transform .22s ease;
  }
  details.ref[open] summary::before{transform:rotate(90deg)}
  details.ref summary:hover{color:var(--ink)}
  details.ref pre{
    white-space:pre-wrap; word-break:break-word; font-size:12.3px;
    background:var(--soft); border:1px solid var(--line); border-radius:10px;
    padding:12px; max-height:260px; overflow:auto; margin:10px 0 0;
    font-family:Consolas,"Courier New",monospace; color:var(--ink-2);
  }

  /* ---------- Figure (hình vẽ) ---------- */
  .figure{
    margin:16px 0; padding:12px; border:1px solid var(--line);
    border-radius:14px; background:#fff; text-align:center;
    transition:transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }
  .figure:hover{transform:translateY(-2px); box-shadow:0 8px 22px rgba(0,0,0,.09); border-color:var(--line-strong)}
  .figure svg{display:block; width:100%; max-width:560px; height:auto; margin:0 auto}
  .figure figcaption{font-size:12px; color:var(--muted); margin-top:8px}

  /* ---------- Loading ---------- */
  .dots{display:inline-flex; gap:4px; vertical-align:middle; margin-right:8px}
  .dots i{width:5px; height:5px; border-radius:50%; background:var(--ink); opacity:.35; animation:blink 1.1s infinite}
  .dots i:nth-child(2){animation-delay:.18s}
  .dots i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  /* ---------- Footer / composer ---------- */
  footer{
    flex:0 0 auto; background:var(--surface); border-top:1px solid var(--line);
    padding:12px 16px 14px;
  }
  .composer{display:flex; gap:10px; max-width:880px; margin:0 auto; align-items:flex-end}
  .input-wrap{flex:1 1 auto; position:relative}
  textarea{
    width:100%; resize:none; min-height:48px; max-height:170px;
    border:1.5px solid var(--line-strong); border-radius:13px; padding:13px 15px;
    font:inherit; font-size:14.5px; line-height:1.4; outline:none; background:var(--surface);
    transition:border-color .15s, box-shadow .15s;
  }
  textarea::placeholder{color:#a1a1aa}
  textarea:focus{border-color:var(--ink); box-shadow:0 0 0 3px rgba(0,0,0,.07)}
  button.send{
    position:relative; overflow:hidden;
    flex:0 0 auto; background:var(--ink); color:#fff; border:1.5px solid var(--ink);
    border-radius:13px; padding:0 22px; height:48px; font-size:14.5px; font-weight:600;
    cursor:pointer;
    transition:background .2s, transform .12s ease, box-shadow .2s ease;
  }
  button.send::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    transform:translateX(-130%);
  }
  button.send:hover{background:#26262a; transform:translateY(-1px); box-shadow:0 7px 18px rgba(0,0,0,.2)}
  button.send:hover::after{animation:shine .65s ease}
  button.send:active{transform:translateY(0) scale(.97); box-shadow:0 2px 6px rgba(0,0,0,.15)}
  button.send:disabled{background:var(--line-strong); border-color:var(--line-strong); color:#fff; cursor:default; opacity:1}
  .hint{max-width:880px; margin:8px auto 0; font-size:11.5px; color:var(--muted); line-height:1.5}

  /* ---------- Scrollbar ---------- */
  #chat::-webkit-scrollbar{width:10px}
  #chat::-webkit-scrollbar-thumb{background:#d9d9dd; border-radius:99px; border:3px solid var(--page)}
  #chat::-webkit-scrollbar-thumb:hover{background:#bfbfc5}
  #chat::-webkit-scrollbar-track{background:transparent}

  :focus-visible{outline:2px solid var(--ink); outline-offset:2px}

  /* ---------- Animations ---------- */
  @keyframes riseIn{
    from{opacity:0; transform:translateY(10px) scale(.99)}
    to{opacity:1; transform:none}
  }
  @keyframes revealIn{
    from{opacity:0; transform:translateY(5px)}
    to{opacity:1; transform:none}
  }
  @keyframes fadeIn{from{opacity:0} to{opacity:1}}
  @keyframes shine{from{transform:translateX(-130%)} to{transform:translateX(130%)}}

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }

  @media (max-width:560px){
    header{padding:12px 14px}
    .brand h1{font-size:15px}
    .brand p{font-size:11.5px}
    #chat{padding:18px 12px 6px; gap:14px}
    .bubble{padding:12px 14px}
    .row.user .bubble{max-width:85%}
    footer{padding:10px 12px 12px}
    button.send{padding:0 16px}
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <h1>Giải bài tập SGK Toán 12</h1>
        <p>Tập 2 · gõ tên bài kèm số trang, ví dụ “bài 1a trang 5”</p>
      </div>
    </div>
    <div class="mode-switch" id="modeSwitch" data-mode="concise" role="group" aria-label="Chế độ trả lời">
      <span class="mode-thumb" aria-hidden="true"></span>
      <button type="button" class="mode-btn" data-mode="concise">Normal</button>
      <button type="button" class="mode-btn" data-mode="fast">Fast</button>
      <button type="button" class="mode-btn" data-mode="detailed">Lí thuyết</button>
    </div>
  </div>
</header>

<main id="chat" aria-live="polite"></main>

<footer>
  <form class="composer" id="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="Nhập tên bài và số trang, ví dụ: bài 1a trang 5" autocomplete="off" aria-label="Câu hỏi"></textarea>
    </div>
    <button class="send" id="send" type="submit">Gửi</button>
  </form>
  <div class="hint">Enter để gửi · Shift + Enter để xuống dòng · <b>/chitiet</b> giải lại bài gần nhất ở chế độ Lí thuyết · <b>/vehinh</b> vẽ hình cho bài gần nhất.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
const chat     = document.getElementById('chat');
const form     = document.getElementById('composer');
const input    = document.getElementById('input');
const sendBtn  = document.getElementById('send');
const modeSwitch = document.getElementById('modeSwitch');
let   busy     = false;

/* ---------- Chế độ và lệnh ---------- */
const MODE_STORAGE = 'toan-chatbox-mode';
const CHI_TIET_CMDS = ['/chitiet', '/chi tiết'];
const VE_HINH_CMDS  = ['/vehinh', '/vẽ hình'];

let mode = localStorage.getItem(MODE_STORAGE);
if (mode !== 'concise' && mode !== 'detailed' && mode !== 'fast') mode = 'concise';

let lastAsked = '';

function updateModeUI(){
  modeSwitch.dataset.mode = mode;
  modeSwitch.querySelectorAll('.mode-btn').forEach(btn => {
    const on = btn.dataset.mode === mode;
    btn.classList.toggle('active', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const active = modeSwitch.querySelector('.mode-btn.active');
  const thumb = modeSwitch.querySelector('.mode-thumb');
  if (active && thumb){
    thumb.style.width = active.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + active.offsetLeft + 'px)';
  }
}

function addNotice(text){
  const el = document.createElement('div');
  el.className = 'notice';
  el.textContent = text;
  chat.appendChild(el);
  scrollDown();
}

function applyMode(next, announce){
  mode = next;
  localStorage.setItem(MODE_STORAGE, mode);
  updateModeUI();
  if (announce){
    const notices = {
      concise: 'Đã chuyển sang chế độ Normal (công thức → thay số → kết quả).',
      fast: 'Đã chuyển sang chế độ Fast (chỉ đề bài + trình bày).',
      detailed: 'Đã chuyển sang chế độ Lí thuyết (chi tiết từng bước).'
    };
    addNotice(notices[mode] || notices.concise);
  }
}

function parseCommand(text){
  const t = text.trim();
  const low = t.toLowerCase();
  for (const c of CHI_TIET_CMDS){
    if (low === c) return { cmd: 'chitiet', rest: '' };
    if (low.startsWith(c + ' ')) return { cmd: 'chitiet', rest: t.slice(c.length).trim() };
  }
  for (const c of VE_HINH_CMDS){
    if (low === c) return { cmd: 'vehinh', rest: '' };
    if (low.startsWith(c + ' ')) return { cmd: 'vehinh', rest: t.slice(c.length).trim() };
  }
  return null;
}

marked.setOptions({ breaks: true, gfm: true });

const escapeHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------- Hình vẽ SVG ---------- */
function sanitizeSvg(raw){
  if (!raw || !raw.trim()) return null;
  let doc;
  try {
    doc = new DOMParser().parseFromString(raw.trim(), 'image/svg+xml');
  } catch (e){ return null; }
  if (doc.querySelector('parsererror')) return null;
  const svg = doc.documentElement;
  if (!svg || svg.nodeName.toLowerCase() !== 'svg') return null;

  svg.querySelectorAll('script, foreignObject, iframe, image, object, embed').forEach(n => n.remove());

  for (const el of [svg, ...svg.querySelectorAll('*')]){
    for (const attr of [...el.attributes]){
      const name = attr.name.toLowerCase();
      if (name.startsWith('on')) el.removeAttribute(attr.name);
      if ((name === 'href' || name === 'xlink:href') && !attr.value.trim().startsWith('#')) {
        el.removeAttribute(attr.name);
      }
    }
  }

  if (!svg.getAttribute('viewBox')){
    const w = parseFloat(svg.getAttribute('width')) || 560;
    const h = parseFloat(svg.getAttribute('height')) || 400;
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
  }
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  if (!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  return svg.outerHTML;
}

function makeFigure(svgHtml){
  const fig = document.createElement('figure');
  fig.className = 'figure';
  fig.innerHTML = svgHtml;
  const cap = document.createElement('figcaption');
  cap.textContent = 'Hình minh họa';
  fig.appendChild(cap);
  return fig;
}

function enhanceFigures(root){
  // 1) Khối mã ```svg ... ```
  root.querySelectorAll('pre > code.language-svg, pre > code.lang-svg').forEach(code => {
    const clean = sanitizeSvg(code.textContent || '');
    if (!clean) return;
    const pre = code.closest('pre');
    if (pre) pre.replaceWith(makeFigure(clean));
  });

  // 2) <svg> thô lọt vào markdown
  root.querySelectorAll('svg').forEach(svg => {
    if (svg.closest('.figure')) return;
    const clean = sanitizeSvg(svg.outerHTML);
    if (!clean){ svg.remove(); return; }
    svg.replaceWith(makeFigure(clean));
  });
}

const MATH_RE = /(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\))/g;

function renderRich(md, target){
  const store = [];
  const withoutMath = md.replace(MATH_RE, m => {
    store.push(m);
    return '@@MATH' + (store.length - 1) + '@@';
  });
  let html = marked.parse(withoutMath);
  html = html.replace(/@@MATH(\d+)@@/g, (_, i) => escapeHtml(store[+i]));
  target.innerHTML = html;
  enhanceFigures(target);
  if (window.renderMathInElement){
    renderMathInElement(target, {
      delimiters: [
        {left:'$$', right:'$$', display:true},
        {left:'\\[', right:'\\]', display:true},
        {left:'\\(', right:'\\)', display:false},
        {left:'$', right:'$', display:false}
      ],
      throwOnError:false, ignoredTags:['script','noscript','style','textarea','pre','code','svg']
    });
  }
}

const BOT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>';
const USER_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';

function addRow(role){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.setAttribute('aria-hidden', 'true');
  avatar.innerHTML = role === 'user' ? USER_ICON : BOT_ICON;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  row.appendChild(avatar);
  row.appendChild(bubble);
  chat.appendChild(row);
  scrollDown();
  return bubble;
}

function addUser(text){
  const bubble = addRow('user');
  bubble.textContent = text;
  return bubble;
}

function scrollDown(){ chat.scrollTop = chat.scrollHeight; }

function setBusy(value){
  busy = value;
  sendBtn.disabled = value;
  chat.setAttribute('aria-busy', value ? 'true' : 'false');
}

async function ask(message, modeOverride){
  if (busy) return;
  lastAsked = message;
  setBusy(true);
  addUser(message);

  const bubble = addRow('bot');
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>Đang giải… (có thể mất 10–40 giây)';
  scrollDown();

  const t0 = Date.now();
  try {
    const res = await fetch('/api/ask', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message, mode: modeOverride || mode })
    });
    const data = await res.json();

    if (!res.ok || (data.error && !data.answer)){
      bubble.classList.add('error');
      bubble.textContent = data.error || 'Có lỗi xảy ra.';
      return;
    }

    bubble.innerHTML = '';
    bubble.classList.add('reveal');
    renderRich(data.answer || '(Không có nội dung)', bubble);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const secs = ((Date.now() - t0) / 1000).toFixed(1);
    meta.innerHTML = (data.page ? '<span class="badge">Trang ' + data.page + '</span>' : '') +
                     '<span>⏱ ' + secs + 's</span>' +
                     (data.error ? '<span>· ' + escapeHtml(data.error) + '</span>' : '');
    bubble.appendChild(meta);

    if (data.pageText){
      const det = document.createElement('details');
      det.className = 'ref';
      const sum = document.createElement('summary');
      sum.textContent = 'Xem nội dung trang ' + data.page + ' trích từ sách';
      const pre = document.createElement('pre');
      pre.textContent = data.pageText;
      det.appendChild(sum);
      det.appendChild(pre);
      bubble.appendChild(det);
    }
  } catch (e){
    bubble.classList.add('error');
    bubble.textContent = 'Không kết nối được máy chủ: ' + e.message;
  } finally {
    setBusy(false);
    scrollDown();
    input.focus();
  }
}

async function drawFigure(message){
  if (busy) return;
  const target = (message || '').trim();
  if (!target){
    addNotice('Chưa có bài nào để vẽ hình. Em hỏi một bài trước đã nha.');
    return;
  }

  setBusy(true);
  addUser('/vehinh');
  const bubble = addRow('bot');
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>Đang vẽ hình…';
  scrollDown();

  try {
    const res = await fetch('/api/figure', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: target })
    });
    const data = await res.json();
    if (data.type === 'book'){
      bubble.innerHTML = '';
      bubble.classList.add('reveal');
      renderRich('**Hình trong sách.**\n\n![Hình trong sách](' + data.url + ')', bubble);
    } else if (data.type === 'svg'){
      bubble.innerHTML = '';
      bubble.classList.add('reveal');
      renderRich('**Hình minh họa.**\n\n```svg\n' + data.svg + '\n```', bubble);
    } else {
      bubble.classList.add('error');
      bubble.textContent = data.reason || 'Không vẽ được hình cho bài này.';
    }
  } catch (err){
    bubble.classList.add('error');
    bubble.textContent = 'Không kết nối được máy chủ: ' + err.message;
  } finally {
    setBusy(false);
    scrollDown();
    input.focus();
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  const raw = input.value.trim();
  if (!raw || busy) return;
  input.value = '';
  input.style.height = 'auto';

  const cmd = parseCommand(raw);
  if (cmd && cmd.cmd === 'chitiet'){
    const target = cmd.rest || lastAsked;
    if (!target){
      addNotice('Chưa có bài nào để giải lại. Em hỏi một bài trước đã nha.');
      return;
    }
    addNotice('Giải lại bài gần nhất ở chế độ Lí thuyết.');
    ask(target, 'detailed');
    return;
  }
  if (cmd && cmd.cmd === 'vehinh'){
    drawFigure(cmd.rest || lastAsked);
    return;
  }
  ask(raw, mode);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 170) + 'px';
});

modeSwitch.addEventListener('click', e => {
  const btn = e.target.closest('.mode-btn');
  if (!btn || busy || btn.dataset.mode === mode) return;
  applyMode(btn.dataset.mode, true);
});

updateModeUI();
window.addEventListener('resize', updateModeUI);
window.addEventListener('load', updateModeUI);

  renderRich(
    'Hii Cún, anh Địn của em đayyy\n\n' +
    'Em gõ **tên bài kèm số trang** là được nha, ví dụ `bài 1a trang 5`.',
    bubble
  );
})();
</script>
